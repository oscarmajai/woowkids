name: Release

# Al llegar commits a main: corre el CI completo, calcula la versión con
# Conventional Commits, crea el tag vX.Y.Z y publica en GHCR la imagen todo en
# uno (frontend, API, PostgreSQL y MinIO) con ese tag y con "latest".
on:
  push:
    branches: [main]
  # Permite volver a publicar a mano las imágenes de la versión actual.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # Un workflow reutilizable no puede pedir más permisos que su llamador.
    permissions:
      contents: read
      pull-requests: read
    with:
      completo: true

  release:
    name: Tag y publicación
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRO: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versión
        id: version
        run: |
          version=$(bash .github/scripts/siguiente_version.sh)
          if [ -n "$version" ]; then
            echo "Siguiente versión: $version"
            echo "crear_tag=true" >> "$GITHUB_OUTPUT"
          else
            # Sin commits nuevos desde el último tag: se publica la versión vigente.
            version=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
            echo "Sin commits nuevos: se publica la versión vigente ${version:-(ninguna)}"
            echo "crear_tag=false" >> "$GITHUB_OUTPUT"
          fi
          [ -n "$version" ] || { echo "::error::No hay versión que publicar"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Crear tag
        if: steps.version.outputs.crear_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Frontend y backend se construyen solo en el runner (no se publican): el
      # driver docker por defecto deja que Dockerfile.allinone los use como base.
      - name: Imágenes base (sin publicar)
        run: |
          docker build -t woowkids-frontend:local \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg "VITE_APP_TITLE=Woow Kids" FrontEnd
          docker build -t woowkids-backend:local BackEnd

      - name: Imagen todo en uno
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FUENTE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build -f Dockerfile.allinone \
            --label "org.opencontainers.image.title=Woow Kids (todo en uno)" \
            --label "org.opencontainers.image.source=$FUENTE" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$REGISTRO/woowkids:$VERSION" -t "$REGISTRO/woowkids:latest" .
          docker push "$REGISTRO/woowkids:$VERSION"
          docker push "$REGISTRO/woowkids:latest"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --generate-notes --verify-tag
