name: Release

# Al llegar commits a main: corre el CI completo, calcula la versión con
# Conventional Commits, crea el tag vX.Y.Z y publica en GHCR las tres imágenes
# (frontend, backend y todo en uno) con ese tag y con "latest".
on:
  push:
    branches: [main]
  # Permite volver a publicar a mano las imágenes de la versión actual.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # Un workflow reutilizable no puede pedir más permisos que su llamador.
    permissions:
      contents: read
      pull-requests: read
    with:
      completo: true

  release:
    name: Tag y publicación
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRO: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versión
        id: version
        run: |
          version=$(bash .github/scripts/siguiente_version.sh)
          if [ -n "$version" ]; then
            echo "Siguiente versión: $version"
            echo "crear_tag=true" >> "$GITHUB_OUTPUT"
          else
            # Sin commits nuevos desde el último tag: se publica la versión vigente.
            version=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
            echo "Sin commits nuevos: se publica la versión vigente ${version:-(ninguna)}"
            echo "crear_tag=false" >> "$GITHUB_OUTPUT"
          fi
          [ -n "$version" ] || { echo "::error::No hay versión que publicar"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Crear tag
        if: steps.version.outputs.crear_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: FrontEnd
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_APP_TITLE=Woow Kids
          tags: |
            ${{ env.REGISTRO }}/woowkids-frontend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRO }}/woowkids-frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: BackEnd
          push: true
          tags: |
            ${{ env.REGISTRO }}/woowkids-backend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRO }}/woowkids-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Imagen todo en uno
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allinone
          push: true
          build-args: |
            FRONTEND_IMAGE=${{ env.REGISTRO }}/woowkids-frontend:${{ steps.version.outputs.version }}
            BACKEND_IMAGE=${{ env.REGISTRO }}/woowkids-backend:${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRO }}/woowkids:${{ steps.version.outputs.version }}
            ${{ env.REGISTRO }}/woowkids:latest
          labels: |
            org.opencontainers.image.title=Woow Kids (todo en uno)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --generate-notes --verify-tag
