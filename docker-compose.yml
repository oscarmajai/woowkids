# Stack completo de Woow Kids: PostgreSQL, MinIO, backend y frontend.
#
#   docker compose up -d --build          # construye desde el código del monorepo
#
# Valores genéricos por defecto (admin / admin1234): cámbialos antes de producción
# copiando .env.example a .env.
# App: http://localhost:8080  ·  API: http://localhost:8000/docs  ·  MinIO: http://localhost:9001
# Entrar: admin@woowkids.com / admin1234 (pide cambiarla al entrar). Empezar de cero: docker compose down -v
#
# ¿Un solo contenedor con todo? Ver Dockerfile.allinone (imagen ghcr.io/oscarmajai/woowkids).

name: woowkids

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
      POSTGRES_DB: ${POSTGRES_DB:-woowkids}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # Chainguard: Docker Hub y quay.io ya no sirven minio/minio.
    # RELEASE.2026-09-22T19-25-18Z, fijada por digest.
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    # La imagen corre como 65532; root mantiene el acceso a volúmenes creados
    # con la imagen anterior, que corría como root.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin1234}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./BackEnd
    image: woowkids-backend:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin1234}@db:5432/${POSTGRES_DB:-woowkids}
      # Vacía: el arranque genera una propia de la instalación y la guarda en la BD.
      SECRET_KEY: ${SECRET_KEY:-}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-8080}"]'
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin1234}
      MINIO_BUCKET: ${MINIO_BUCKET:-woowkids}
      MINIO_SECURE: "false"
      # Por HTTP (sin TLS) el navegador no guarda una cookie Secure salvo en
      # localhost. En producción detrás de HTTPS debe ser true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@woowkids.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
    volumes:
      # Para el respaldo que se hace antes de aplicar migraciones.
      - ${BACKUP_HOST_DIR:-respaldos}:/respaldos
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # Respaldos automáticos de la BD y de MinIO cada BACKUP_CADA_HORAS horas
  # (BackEnd/scripts/respaldos.py). Con BACKUP_HOST_DIR=/ruta/del/equipo quedan
  # en una carpeta del equipo en vez de un volumen de Docker.
  respaldos:
    image: woowkids-backend:local
    entrypoint: ["/app/docker/respaldos.sh"]
    command: ["programado"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin1234}@db:5432/${POSTGRES_DB:-woowkids}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin1234}
      MINIO_BUCKET: ${MINIO_BUCKET:-woowkids}
      BACKUP_CADA_HORAS: ${BACKUP_CADA_HORAS:-6}
      BACKUP_DIAS_CONSERVAR: ${BACKUP_DIAS_CONSERVAR:-14}
    volumes:
      - ${BACKUP_HOST_DIR:-respaldos}:/respaldos
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build:
      context: ./FrontEnd
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_TITLE: Woow Kids
    image: woowkids-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
  respaldos:
