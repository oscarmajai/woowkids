# Certificado raíz de esta instalación y la página que explica cómo instalarlo
# en cada terminal. Van también por HTTP: la terminal aún no confía en HTTPS.
location = /certificado-woowkids.crt {
    alias /usr/share/woowkids/certificado-woowkids.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="certificado-woowkids.crt"';
}

location = /instalar-certificado {
    alias /usr/share/woowkids/instalar-certificado.html;
    default_type text/html;
    add_header Cache-Control no-store;
}
