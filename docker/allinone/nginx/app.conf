# La aplicación: archivos estáticos del front y /api al backend. Lo incluyen
# los servidores de los puertos 443 y 80 (ver nginx.conf).
root /usr/share/woowkids/front;
index index.html;
access_log /dev/stdout sin_query_string;
error_log /dev/stderr warn;

client_header_buffer_size 8k;
large_client_header_buffers 4 32k;
client_max_body_size 12m;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy same-origin always;

include /etc/nginx/woowkids/certificado.conf;

location /api/ {
    proxy_pass         http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_read_timeout 1d;
}

location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
