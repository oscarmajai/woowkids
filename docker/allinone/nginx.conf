map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Sin query string en el log: no registrar los tickets ni tokens de WebSocket.
log_format sin_query_string
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

# HTTPS opcional (puerto 443, solo si se publica). Por HTTP todo funciona; la
# webcam dentro de la página es lo único que el navegador reserva a HTTPS (sin
# ella el registro usa la cámara del dispositivo o un archivo). El certificado
# lo prepara /etc/woowkids/tls.sh en /data/tls.
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /data/tls/servidor.crt;
    ssl_certificate_key /data/tls/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:10m;

    include /etc/nginx/woowkids/app.conf;
}

# HTTP (puerto 80): la forma normal de usar el sistema en la red local. Con
# REDIRIGIR_HTTPS=true (opcional) redirige a HTTPS salvo la página para
# instalar el certificado. start.sh escribe http.conf según el caso.
server {
    listen 80;
    include /etc/nginx/woowkids/http.conf;
}
