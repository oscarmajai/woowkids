map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Sin query string en el log: no registrar tokens de WebSocket (QA #32).
log_format sin_query_string
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

# HTTPS (puerto 443). La caja, el POS y la cámara usan APIs del navegador que
# solo existen en un contexto seguro: desde otra computadora, por HTTP no
# funcionan. El certificado lo prepara /etc/woowkids/tls.sh en /data/tls.
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /data/tls/servidor.crt;
    ssl_certificate_key /data/tls/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:10m;

    include /etc/nginx/woowkids/app.conf;
}

# HTTP (puerto 80): siempre sirve la página para instalar el certificado en
# cada terminal. Con REDIRIGIR_HTTPS=true todo lo demás redirige a HTTPS; si no,
# sirve la app igual que antes (instalaciones que solo publican el 80 o que ya
# tienen un proxy HTTPS delante). start.sh escribe http.conf según el caso.
server {
    listen 80;
    include /etc/nginx/woowkids/http.conf;
}
